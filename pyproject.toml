[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trouble-solver"
version = "0.3.0"
description = "TroubleSolver：开源的、会自我证伪的建模助手——先引导把问题问全，再建模并主动搜自己的反例；七条可执行验证协议 + 可追溯台账，交付数字零手写、逐条可复算"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["modeling", "falsification", "verification", "ledger", "reproducibility", "troublesolver"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
tsolve = "troublesolver.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
